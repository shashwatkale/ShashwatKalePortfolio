<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="100%" stop-color="#020308"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded squircle with glow border -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="url(#glowGrad)" stroke-width="16"/>

  <!-- Futuristic Cybernetic SK Monogram -->
  <g filter="url(#neonGlow)">
    <!-- Letter S -->
    <path d="M 220 160 L 150 160 C 130 160 115 175 115 195 L 115 220 C 115 240 130 255 150 255 L 200 255 C 220 255 235 270 235 290 L 235 320 C 235 340 220 355 200 355 L 120 355" 
          fill="none" stroke="url(#glowGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Letter K -->
    <path d="M 285 155 L 285 355" 
          fill="none" stroke="url(#glowGrad)" stroke-width="36" stroke-linecap="round"/>
    <path d="M 395 160 L 290 260 L 400 355" 
          fill="none" stroke="url(#glowGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Quantum Circuit Nodes -->
    <circle cx="220" cy="160" r="10" fill="#00f0ff"/>
    <circle cx="120" cy="355" r="10" fill="#ec4899"/>
    <circle cx="395" cy="160" r="10" fill="#00f0ff"/>
    <circle cx="400" cy="355" r="10" fill="#ec4899"/>
  </g>
</svg>